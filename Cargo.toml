[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["sliva0 <sliva0mk@gmail.com>"]
repository = "https://github.com/sliva0/tgradish"

[workspace.dependencies]
tgradish-core = { path = "crates/core", version = "2.0.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ctrlc = "3.5.2"
directories = "6.0.0"
indicatif = "0.18.6"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.7"
which = "8.0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
