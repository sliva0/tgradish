[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Separate workspace; see crates/tgs-lab/Cargo.toml.
exclude = ["crates/tgs-lab"]

# Shared application version for core, GUI, CLI, and xtask.
# tgradish-tgs is versioned independently.
[workspace.package]
version = "2.1.1"
edition = "2024"
# Minimum supported Rust version: required by `if let` match guards and egui.
rust-version = "1.95"
license = "MIT"
authors = ["sliva0 <sliva0mk@gmail.com>"]
repository = "https://github.com/sliva0/tgradish"

# Pin internal workspace crates to exact versions: they are released together,
# and `cargo install` resolves fresh dependencies without Cargo.lock, so a
# looser requirement could pair crates that were never built together.
[workspace.dependencies]
tgradish-core = { path = "crates/core", version = "=2.1.1" }
# Unpublished dev-dependency for synthetic test media; omitting `version`
# keeps it out of published crate manifests.
tgradish-corpus = { path = "crates/corpus" }
tgradish-gui = { path = "crates/gui", version = "=2.1.1" }
tgradish-tgs = { path = "crates/tgs", version = "=0.2.0" }

anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
# Shell completions and man pages; keep aligned with clap.
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
console = "0.16.6"
ctrlc = "3.5.2"
directories = "6.0.0"
embed-resource = "3.0.12"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
# GUI test harness; keep aligned with eframe.
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
egui-wgpu = "0.36.2"
flate2 = "1.1.10"
gif = "0.14.2"
# GUI localisation tests, parsing Fluent files directly.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
# GUI localisation: embeds Fluent files and checks message keys at compile time
# via `fl!`.
i18n-embed = { version = "0.16.0", default-features = false, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = "0.10.1"
image-webp = "0.2.4"
libloading = "0.8.9"
# Global allocator for musl builds; see crates/cli/src/main.rs.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = { version = "0.1.52", features = ["override"] }
# SIGTERM and SIGHUP handling (see crates/cli/src/signals.rs); already pulled
# in by ctrlc.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# System accent colour on macOS; already pulled in by the GUI stack there.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std", "parallel"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format", "software-scaling"] }
indicatif = "0.18.6"
png = "0.18.1"
skrifa = "0.44.0"
sys-locale = "0.3.2"
raw-window-handle = "0.6.2"
rustix = "1.1.5"
rfd = "0.17.2"
# Embed in debug builds too so `fl!` validates embedded files during
# development.
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# Each crate enables only the features it needs to avoid leaking features to
# consumers.
serde_json = "1.0.151"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.7"
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
which = "8.0.6"
windows-sys = "0.61.2"
winit = { version = "0.30.13", default-features = false }
zopfli = { version = "0.8.3", default-features = false, features = ["gzip", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The TGS encoder searches a lot: unoptimised, the test corpus takes minutes.
[profile.dev.package.tgradish-tgs]
opt-level = 2

# zopfli packs both the final .tgs and size-fitting estimates.
[profile.dev.package.zopfli]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Optimise most dependencies (GUI, CLI parsing) for size, and hot
# decoding/encoding/compression crates for speed.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.zopfli]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.weezl]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3
