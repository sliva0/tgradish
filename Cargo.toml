[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# a workspace of its own, see its manifest
exclude = ["crates/tgs-lab"]

# the application's version, which core, the window and the command line
# share; the two libraries, tgradish-frames and tgradish-tgs, have their own
[workspace.package]
version = "2.0.0"
edition = "2024"
# the oldest Rust that builds every crate: `if let` guards in matches need
# it, as does the window's egui
rust-version = "1.95"
license = "MIT"
authors = ["sliva0 <sliva0mk@gmail.com>"]
repository = "https://github.com/sliva0/tgradish"
homepage = "https://github.com/sliva0/tgradish"

# The workspace's own crates ask for each other's exact versions: they are
# released together, and `cargo install` resolves afresh rather than read
# Cargo.lock, so a looser requirement could pair crates never built as one.
[workspace.dependencies]
tgradish-core = { path = "crates/core", version = "=2.0.0" }
# synthetic test art, unpublished
tgradish-corpus = { path = "crates/corpus" }
tgradish-frames = { path = "crates/frames", version = "=0.1.0" }
tgradish-gui = { path = "crates/gui", version = "=2.0.0" }
tgradish-tgs = { path = "crates/tgs", version = "=0.1.0" }

anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
ctrlc = "3.5.2"
directories = "6.0.0"
embed-resource = "3.0.12"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
# the window's tests, which must move with eframe
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
egui-wgpu = "0.36.2"
flate2 = "1.1.10"
gif = "0.14.2"
# the window's translations' tests, which read the files as Fluent does
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
# the window's translations: Fluent files built into the binary, `fl!`
# checking their messages at compile time
i18n-embed = { version = "0.16.0", default-features = false, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = "0.10.1"
image-webp = "0.2.4"
libloading = "0.8.9"
# the allocator of musl builds, see crates/cli/src/main.rs
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = { version = "0.1.52", features = ["override"] }
# the accent colour on macOS, already in the window's dependencies there
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std", "parallel"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format", "software-scaling"] }
indicatif = "0.18.6"
png = "0.18.1"
skrifa = "0.44.0"
sys-locale = "0.3.2"
raw-window-handle = "0.6.2"
rustix = "1.1.5"
rfd = "0.17.2"
# in debug builds too, so that `fl!` checks the files that are built in
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# each crate names the features it needs, so publishing one doesn't turn
# another's on for whoever depends on it
serde_json = "1.0.151"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.7"
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
which = "8.0.6"
windows-sys = "0.61.2"
winit = { version = "0.30.13", default-features = false }
zopfli = { version = "0.8.3", default-features = false, features = ["gzip", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# the encoder searches a lot, which takes minutes over the test corpus
# without optimisation
[profile.dev.package.tgradish-tgs]
opt-level = 2

# and packs them, fitting's estimates as well as the result
[profile.dev.package.zopfli]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# most dependencies are the window's and argument parsing, which aren't
# where time goes; what decodes, writes and compresses stickers is
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.zopfli]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.weezl]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3
