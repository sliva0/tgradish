[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["sliva0 <sliva0mk@gmail.com>"]
repository = "https://github.com/sliva0/tgradish"

[workspace.dependencies]
tgradish-core = { path = "crates/core", version = "2.0.0" }
tgradish-frames = { path = "crates/frames", version = "2.0.0" }
tgradish-gui = { path = "crates/gui", version = "2.0.0" }
tgradish-tgs = { path = "crates/tgs", version = "2.0.0" }

anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
ctrlc = "3.5.2"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format", "software-scaling"] }
indicatif = "0.18.6"
png = "0.18.1"
rfd = "0.17.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "unbounded_depth"] }
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.7"
which = "8.0.6"
zopfli = { version = "0.8.3", default-features = false, features = ["gzip", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# the encoder searches a lot, which takes minutes over the test corpus
# without optimisation
[profile.dev.package.tgradish-tgs]
opt-level = 2

# tgs-lab's tests render every frame of stickers
[profile.dev.package.tlottie]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
