[package]
name = "tgradish"
description = "Telegram video, image and animated stickers and emoji from videos, pictures and pixel art, with the ability to bypass the 3 second limit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["gui"]
# the window, `tgradish gui`
gui = ["dep:tgradish-gui", "dep:windows-sys"]
# ffmpeg linked into the binary instead of separate executables
linked = ["tgradish-core/linked"]
linked-static = ["tgradish-core/linked-static"]

[dependencies]
png.workspace = true
tgradish-core = { workspace = true, features = ["clipboard"] }
tgradish-gui = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
thiserror.workspace = true
toml.workspace = true

# closes the console Windows opens for the window
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"], optional = true }

# in place of musl's malloc, for the whole program
[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys.workspace = true
mimalloc.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[dev-dependencies]
schemars.workspace = true
tgradish-corpus.workspace = true
tempfile.workspace = true
