[package]
name = "tgradish"
description = "Converts videos into Telegram video stickers, with the ability to bypass the 3 second limit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tgradish"
path = "src/main.rs"

[features]
default = ["gui"]
# the window, `tgradish gui`
gui = ["dep:tgradish-gui"]
# ffmpeg linked into the binary instead of separate executables
linked = ["tgradish-core/linked"]
linked-static = ["tgradish-core/linked-static"]

[dependencies]
tgradish-core.workspace = true
tgradish-gui = { workspace = true, optional = true }

anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
png.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[build-dependencies]
embed-manifest.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
