[package]
name = "tgradish"
# The one-line description; packages, flake.nix and the .desktop file repeat it
# (checked by an xtask test).
description = "Telegram video, static and animated stickers and emoji from videos, images or pixel art"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Included by Cargo when packaging the crate.
readme = "../../README.md"
keywords = ["telegram", "sticker", "emoji", "webm", "pixel-art"]
categories = ["command-line-utilities", "multimedia::video", "multimedia::images"]

[features]
default = ["gui"]
# Desktop GUI (`tgradish gui`).
gui = ["dep:tgradish-gui", "dep:windows-sys"]
# Link ffmpeg libraries into the binary instead of running external processes.
linked = ["tgradish-core/linked"]
# Link ffmpeg libraries statically, as release builds do.
linked-static = ["linked", "tgradish-core/linked-static"]

[dependencies]
png.workspace = true
tgradish-core = { workspace = true, features = ["clipboard"] }
tgradish-gui = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
clap_mangen.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
serde.workspace = true
# Preserve field order in `--json` output.
serde_json = { workspace = true, features = ["preserve_order"] }
shlex.workspace = true
thiserror.workspace = true
toml.workspace = true

# Handle SIGTERM and SIGHUP separately from Ctrl-C (ctrlc merges them).
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Detach the console window that Windows creates when launching the GUI.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"], optional = true }

# Replace musl's allocator across the whole process (including C libraries).
[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys.workspace = true
mimalloc.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[dev-dependencies]
tgradish-corpus.workspace = true
tempfile.workspace = true

# Signal tests become subreapers on Linux to verify no child processes leak.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
