[package]
name = "tgradish"
# the one sentence saying what tgradish is: the packages, the flake and the
# menu entry say the same, which an xtask test holds them to
description = "Telegram video, static and animated stickers and emoji from videos, images or pixel art"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# cargo packs it into the crate
readme = "../../README.md"
keywords = ["telegram", "sticker", "emoji", "webm", "pixel-art"]
categories = ["command-line-utilities", "multimedia::video", "multimedia::images"]

[features]
default = ["gui"]
# the GUI, `tgradish gui`
gui = ["dep:tgradish-gui", "dep:windows-sys"]
# ffmpeg linked into the binary instead of separate executables
linked = ["tgradish-core/linked"]
# link them statically, as release builds do
linked-static = ["linked", "tgradish-core/linked-static"]

[dependencies]
png.workspace = true
tgradish-core = { workspace = true, features = ["clipboard"] }
tgradish-gui = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
clap_mangen.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
serde.workspace = true
# the order of fields in what `--json` prints
serde_json = { workspace = true, features = ["preserve_order"] }
shlex.workspace = true
thiserror.workspace = true
toml.workspace = true

# SIGTERM and SIGHUP, which ctrlc can't tell from Ctrl-C
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# closes the console Windows opens for the GUI
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"], optional = true }

# in place of musl's malloc, for the whole program
[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys.workspace = true
mimalloc.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[dev-dependencies]
schemars.workspace = true
tgradish-corpus.workspace = true
tempfile.workspace = true

# the signal tests keep the orphans of what they start, to see none is left
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
