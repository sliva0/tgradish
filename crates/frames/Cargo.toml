[package]
name = "tgradish-frames"
description = "Decodes GIF, APNG, WebP, JPEG, BMP, Aseprite and sprite sheets into RGBA frames with durations, in pure Rust"
# a library with its own version, not the application's
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["animation", "gif", "apng", "aseprite", "sprite-sheet"]
categories = ["multimedia::images", "wasm"]

# it has no features; docsrs for what a later one would mark
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
flate2.workspace = true
image.workspace = true
thiserror.workspace = true

[dev-dependencies]
tgradish-corpus.workspace = true

[lints]
workspace = true
