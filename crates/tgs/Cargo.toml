[package]
name = "tgradish-tgs"
description = "Telegram animated stickers (.tgs) from pixel art animations"
# a library with its own version, not the application's
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["telegram", "sticker", "tgs", "lottie", "pixel-art"]
categories = ["multimedia::images", "multimedia::encoding", "wasm"]

# with the schemas and the threads, but not the internals, which aren't
# for others to use; core's features need ffmpeg, so it has no such line
[package.metadata.docs.rs]
features = ["schema", "threads"]

[dependencies]
tgradish-frames.workspace = true

flate2.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
# reads Lottie nested deeper than serde_json's own limit, see check.rs
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror.workspace = true
zopfli.workspace = true

[features]
# JSON Schemas of reports and options, for front-ends
schema = ["dep:schemars"]
# Fitting tries its candidates in threads of their own, and zopfli packs in
# one. zopfli can't be stopped, so a thread packing when a sticker is
# cancelled is left to finish alone, and at most two pack at once in the
# whole process, however many stickers are being made. Does nothing on
# wasm, which has no threads to start.
threads = []
# The encoder's interior, public for tgs-lab's benchmarks, render checks
# and probes: scenes, Lottie, layout, the painter and its settings, and
# how stickers are packed and marked. Unstable, and exempt from semver:
# anything behind it can change in any release.
internals = []

[dev-dependencies]
tgradish-corpus.workspace = true

[lints]
workspace = true
