[package]
name = "tgradish-tgs"
description = "Pure-Rust library that converts pixel art (GIF, APNG, WebP, Aseprite, sprite sheets) into Telegram animated stickers (.tgs) and validates .tgs files"
# Independently versioned from the main tgradish application.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["telegram", "sticker", "lottie", "pixel-art", "aseprite"]
categories = ["multimedia::images", "multimedia::encoding", "wasm"]

# Document `schema` and `threads` but not `internals`, which is not for others
# to use. Core has no such section: its features need ffmpeg.
[package.metadata.docs.rs]
features = ["schema", "threads"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
flate2.workspace = true
image.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
# Allow Lottie files nested deeper than serde_json's default recursion limit
# (see check.rs).
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror.workspace = true
zopfli.workspace = true

[features]
# Derive JSON Schemas for options and reports.
schema = ["dep:schemars"]
# Evaluate size-fitting candidates across worker threads (up to
# `options.threads`) and run zopfli compression on a worker thread. Because
# zopfli cannot be cancelled, an in-flight compression thread finishes in the
# background on cancellation, and a global limit of two concurrent zopfli
# threads applies process-wide. No-op on wasm.
threads = []
# Expose internal encoder types (scenes, Lottie, layout, painter, packing,
# rectangle ordering) for tgs-lab benchmarks, render checks and probes.
# Unstable and exempt from semver.
internals = []

[dev-dependencies]
tgradish-corpus.workspace = true

[lints]
workspace = true
