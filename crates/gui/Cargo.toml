[package]
name = "tgradish-gui"
description = "The tgradish GUI, converting with tgradish-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["telegram", "sticker", "emoji", "egui", "pixel-art"]
categories = ["multimedia::video", "multimedia::images"]
# Art used only by the README screenshot test, and how the fonts are made.
exclude = ["/readme-art", "/assets/fonts/subset.py"]

[dependencies]
tgradish-core = { workspace = true, features = ["clipboard"] }
# Copies a result to the clipboard as a file, for pasting into Telegram;
# core pastes with it too.
arboard.workspace = true

eframe.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
skrifa.workspace = true
rfd.workspace = true
rust-embed.workspace = true
shlex.workspace = true
tempfile.workspace = true

# Check the current user ID to verify ownership of the single-instance
# socket directory.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["event"] }
wayland-client.workspace = true
# Use system libwayland-client so we can share winit's display connection.
wayland-backend = { workspace = true, features = ["client_system"] }
# Set the window icon on Wayland (which winit does not set).
wayland-protocols = { workspace = true, features = ["client", "staging"] }
winit = { workspace = true, features = ["wayland"] }
# Load libdbus at runtime to query the system accent colour from the
# desktop portal.
libloading.workspace = true

# The system's languages, where they aren't the environment's locales,
# which the GUI reads itself.
[target.'cfg(any(not(unix), target_vendor = "apple", target_os = "android"))'.dependencies]
sys-locale.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Query the system accent colour from AppKit.
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
# Registry accent colour, ShellExecute links, and single-instance named pipe.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
fluent-bundle.workspace = true
fluent-syntax.workspace = true
# Used by crates/gui/src/strings.rs to crop UI screenshots.
image.workspace = true
egui_kittest.workspace = true
egui-wgpu.workspace = true
tgradish-corpus.workspace = true
