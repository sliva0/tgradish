[package]
name = "tgradish-gui"
description = "The tgradish window: converts with tgradish-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["telegram", "sticker", "emoji", "egui", "pixel-art"]
categories = ["multimedia::video", "multimedia::images"]

[dependencies]
tgradish-core = { workspace = true, features = ["clipboard"] }

eframe.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
skrifa.workspace = true
sys-locale.workspace = true
rfd.workspace = true
rust-embed.workspace = true
shlex.workspace = true
tempfile.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["event"] }
wayland-client.workspace = true
# libwayland's own client, which can share winit's connection
wayland-backend = { workspace = true, features = ["client_system"] }
# the window's icon, which winit doesn't set on Wayland
wayland-protocols = { workspace = true, features = ["client", "staging"] }
winit = { workspace = true, features = ["wayland"] }
# libdbus, for the accent colour from the desktop portal
libloading.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# the accent colour, from AppKit
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
# the accent colour, from the registry
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }

[lints]
workspace = true

[dev-dependencies]
fluent-bundle.workspace = true
fluent-syntax.workspace = true
# the pictures of crates/gui/src/strings.rs, cut to their parts
image.workspace = true
egui_kittest.workspace = true
egui-wgpu.workspace = true
tgradish-corpus.workspace = true
