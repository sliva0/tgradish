[package]
name = "tgradish-core"
description = "Library behind tgradish: Telegram video sticker conversion and WebM duration spoofing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["download"]
# `tgradish ffmpeg download`: HTTP client and archive extraction
download = ["dep:flate2", "dep:sha2", "dep:tar", "dep:ureq"]

[dependencies]
directories.workspace = true
flate2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
which.workspace = true


[lints]
workspace = true
