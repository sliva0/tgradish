[package]
name = "tgradish-core"
description = "Library behind tgradish: Telegram video, image and pixel art sticker conversion, and WebM duration spoofing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# ffmpeg libraries linked into the binary, from the system or FFMPEG_DIR
linked = ["dep:ffmpeg-next"]
# link them statically, as release builds do
linked-static = ["linked", "ffmpeg-next/static"]
# reading files and images from the clipboard
clipboard = ["dep:arboard"]

[dependencies]
flate2.workspace = true
tgradish-tgs = { workspace = true, features = ["schema", "threads"] }

arboard = { workspace = true, optional = true }
directories.workspace = true
image-webp.workspace = true
libwebp-sys.workspace = true
ffmpeg-next = { workspace = true, optional = true }
png.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
which.workspace = true

[dev-dependencies]
tgradish-corpus.workspace = true

[lints]
workspace = true

[build-dependencies]
flate2.workspace = true
