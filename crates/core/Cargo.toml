[package]
name = "tgradish-core"
description = "Core conversion library for tgradish: Telegram video, static and pixel-art stickers, plus WebM duration spoofing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["telegram", "sticker", "emoji", "webm", "ffmpeg"]
categories = ["multimedia::video", "multimedia::images", "multimedia::encoding"]

# Document the clipboard feature; docs.rs lacks the ffmpeg libraries `linked`
# needs.
[package.metadata.docs.rs]
features = ["clipboard"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Link ffmpeg libraries directly (from the system or FFMPEG_DIR).
linked = ["dep:ffmpeg-next"]
# Link ffmpeg libraries statically, as release builds do.
linked-static = ["linked", "ffmpeg-next/static"]
# Read files and images from the system clipboard.
clipboard = ["dep:arboard"]

[dependencies]
flate2.workspace = true
tgradish-tgs = { workspace = true, features = ["threads"] }

arboard = { workspace = true, optional = true }
directories.workspace = true
image-webp.workspace = true
libwebp-sys.workspace = true
ffmpeg-next = { workspace = true, optional = true }
png.workspace = true
serde.workspace = true
# Preserve struct field order when serialising options to CLI flags.
serde_json = { workspace = true, features = ["preserve_order"] }
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
which.workspace = true

[dev-dependencies]
tgradish-corpus.workspace = true

[lints]
workspace = true

[build-dependencies]
flate2.workspace = true
