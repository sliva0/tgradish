[package]
name = "tgradish-core"
description = "Library behind tgradish: Telegram video sticker conversion and WebM duration spoofing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# ffmpeg libraries linked into the binary, from the system or FFMPEG_DIR
linked = ["dep:ffmpeg-next"]
# link them statically, as release builds do
linked-static = ["linked", "ffmpeg-next/static"]

[dependencies]
tgradish-tgs = { workspace = true, features = ["schema"] }

directories.workspace = true
ffmpeg-next = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
which.workspace = true


[lints]
workspace = true
