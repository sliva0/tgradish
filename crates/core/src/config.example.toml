preset = "balanced"   # preset used when none is given, for WebM and images
tgs-preset = "best"   # the same for TGS

[ffmpeg]
from = "auto"         # auto (built in if there is one, else system),
                      # builtin or system, as --ffmpeg-from
path = "/opt/ffmpeg"  # ffmpeg executable or its directory, overrides `from`

# the window's own: keys it doesn't know are kept, and a value it can't
# read leaves that setting as it would be without it
[gui]
output-dir = "/home/me/stickers"  # results go here instead of next to inputs
overwrite = false                  # replace existing results
target = "sticker"                 # what new files become, or "emoji"
smooth-scrolling = false           # ease scrolling instead of following the wheel
language = "en-GB"                 # the window's; the system's if left out
theme = "system"                   # or "light" or "dark"
reopen-files = true                # reopen the files of last time
timeline-frames = false            # count the timeline in frames, not seconds

[gui.result-preview]
size = 3                 # the result's small picture, from 1 to 5
corner = "bottom-right"  # or "bottom-left", "top-right", "top-left"
