preset = "balanced"   # default preset for WebM and WebP
tgs-preset = "best"   # default preset for TGS
threads = "auto"      # max threads per conversion: "auto" (as many as each
                      # part of the conversion can use) or a number, as
                      # --threads

[ffmpeg]
from = "auto"         # "auto" (built-in if available, else system), "builtin"
                      # or "system", as --ffmpeg-from
path = "/opt/ffmpeg"  # ffmpeg executable or its directory (overrides `from`)

# GUI settings. Unknown keys are preserved, and invalid values fall back to
# defaults.
[gui]
output-dir = "/home/me/stickers"  # save results here instead of beside inputs
overwrite = false                  # overwrite existing output files
target = "sticker"                 # default for new files: "sticker" or "emoji"
motion = true                      # animate scrolling and transitions, unless
                                   # the system asks for less motion
language = "en-GB"                 # GUI language tag (system's if omitted)
theme = "system"                   # "system", "light" or "dark"
accent = "system"                  # "system", "#rrggbb" or a named colour:
                                   # "pink", "red", "orange", "yellow", "green",
                                   # "teal", "blue", "purple", "violet", "grey"
scale = 1.0                        # UI scale from 0.5 to 5 (Ctrl+= and Ctrl+-
                                   # adjust it; Ctrl+0 resets to 1)
reopen-files = true                # reopen files from the previous session
timeline-frames = false            # show timeline in frames instead of seconds

[gui.result-preview]
size = 3                 # result thumbnail size, from 1 to 5
corner = "bottom-right"  # "bottom-right", "bottom-left", "top-right", "top-left"
