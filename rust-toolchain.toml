# Track latest stable rather than pinning a version: distributions build
# tgradish with the stable Rust they ship, and tracking latest stable in CI
# catches regressions from new Rust releases before distributions hit them.
# The oldest supported Rust is `rust-version` in Cargo.toml (also checked in
# CI). Release builds pin their toolchain via RUSTUP_TOOLCHAIN in
# .github/workflows/release.yml.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
