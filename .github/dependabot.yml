version: 2
updates:
  # Update GitHub Actions weekly in a single grouped PR. Third-party actions are
  # pinned by commit SHA (which a tag cannot be moved away from), with the
  # version in a comment for Dependabot to raise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
