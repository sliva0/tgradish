name: CI

# Skip pure Markdown changes, except files validated by CI (CHANGELOG.md,
# README.md links, and licence files). The last matching pattern wins.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - README.md
      - CHANGELOG.md
      - crates/core/licenses/**
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - README.md
      - CHANGELOG.md
      - crates/core/licenses/**

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Fail (rather than skip) tests if ffmpeg is missing.
    env:
      TGRADISH_REQUIRE_FFMPEG: 1
    steps:
      - uses: actions/checkout@v7

      # Uses latest stable with clippy and rustfmt from rust-toolchain.toml.
      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo fmt --all --check
      # Run --locked first so a stale Cargo.lock fails before later commands
      # can modify it.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Check the CLI-only build (without the GUI feature).
      - run: cargo clippy -p tgradish --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace
      # tgradish-tgs alone, single-threaded as on the web (the workspace enables
      # `threads`).
      - run: cargo test -p tgradish-tgs
      # Verify menu and Windows icons match the GUI icon.
      - run: cargo xtask icons --check
      # Verify all version numbers and the changelog agree (see
      # CONTRIBUTING.md).
      - run: cargo xtask release check
        if: runner.os == 'Linux'
      # Check rustdoc warnings and broken intra-doc links (platform-independent,
      # so Linux only).
      - run: cargo doc --workspace --no-deps
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
      # Dry-run crates.io packaging and builds for the library crates in
      # dependency order.
      - run: cargo publish --dry-run --locked -p tgradish-tgs -p tgradish-core
        if: runner.os == 'Linux'

      # Verify bundled third-party crate licences are up to date.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.os == 'Linux'
        with:
          # Pin exact version to match CARGO_ABOUT in xtask/src/licenses.rs
          # (output wording varies across versions).
          tool: cargo-about@0.9.2
      - run: cargo xtask licenses --check
        if: runner.os == 'Linux'

  # Compile-check macOS-only code: checked rather than run because no release is
  # built for macOS and tests would need ffmpeg. Without `linked`, so no ffmpeg
  # dev libraries are needed.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Verify the workspace builds with the MSRV declared in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust of rust-version
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          # Override rust-toolchain.toml's stable channel.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  # Test the built-in ffmpeg backend against Ubuntu's ffmpeg dev packages.
  linked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # As in check.
    env:
      TGRADISH_REQUIRE_FFMPEG: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ffmpeg and its development files
        run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev
      # Only tgradish-core changes under `linked`; test the CLI and GUI against
      # it too.
      - run: cargo clippy -p tgradish-core --all-targets --features linked --locked -- -D warnings
      - run: >
          cargo test -p tgradish-core -p tgradish -p tgradish-gui
          --features tgradish/linked

  # Check musl-specific code (mimalloc allocator and C dependencies built with
  # musl-gcc).
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update && sudo apt-get install -y musl-tools
      - run: >
          cargo clippy -p tgradish --target x86_64-unknown-linux-musl --all-targets --locked
          -- -D warnings
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

  # Test tgs-lab (separate workspace): renders .tgs output with tlottie and
  # rlottie.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/tgs-lab -> target
      - name: Install what Telegram's rlottie builds with
        run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - run: cargo fmt --manifest-path crates/tgs-lab/Cargo.toml --check
      - run: >
          cargo clippy --manifest-path crates/tgs-lab/Cargo.toml --all-targets
          --features rlottie --locked -- -D warnings
      - run: cargo test --manifest-path crates/tgs-lab/Cargo.toml --features rlottie

  # Verify tgradish-tgs compiles for WebAssembly (no filesystem, subprocesses,
  # or threads).
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check -p tgradish-tgs --target wasm32-unknown-unknown --locked
