name: CI

on:
  push:
    branches: [master, rewrite-v2]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml selects stable with clippy and rustfmt
      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # the built-in ffmpeg backend, against the distribution's ffmpeg libraries
  linked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg and its development files
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev
      - run: cargo clippy --workspace --all-targets --features tgradish/linked -- -D warnings
      - run: cargo test --workspace --features tgradish/linked,tgradish-core/linked
