name: CI

on:
  push:
    branches: [master, rewrite-v2]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml selects stable with clippy and rustfmt
      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # binaries carry the licenses of their crates; they must list today's
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about
      - run: cargo xtask licenses --check
        if: runner.os == 'Linux'

  # the built-in ffmpeg backend, against the distribution's ffmpeg libraries
  linked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg and its development files
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev
      - run: cargo clippy --workspace --all-targets --features tgradish/linked -- -D warnings
      - run: cargo test --workspace --features tgradish/linked,tgradish-core/linked

  # .tgs output rendered with rlottie too; the check job covers tlottie
  rlottie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install what Telegram's rlottie builds with
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - run: cargo clippy -p tgs-lab --all-targets --features rlottie -- -D warnings
      - run: cargo test -p tgs-lab --features rlottie

  # libraries the Telegram web app will run in the browser
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tgradish-frames -p tgradish-tgs --target wasm32-unknown-unknown
