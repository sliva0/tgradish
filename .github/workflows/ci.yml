name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# a newer push makes an older run of the same branch or pull request moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# nothing here writes to the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml selects stable with clippy and rustfmt
      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo fmt --all --check
      # --locked first, so a Cargo.lock that is out of date fails rather
      # than being rewritten for the steps after
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # the command line on its own, without the window
      - run: cargo clippy -p tgradish --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace
      # .tgs on one thread, as for the web: the workspace's other crates
      # turn on its threads
      - run: cargo test -p tgradish-tgs
      # the icons for menus and Windows, made from the window's
      - run: cargo xtask icons --check

      # binaries carry the licences of their crates; they must list today's
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.os == 'Linux'
        with:
          # other versions word the list differently
          tool: cargo-about@0.9.2
      - run: cargo xtask licenses --check
        if: runner.os == 'Linux'

  # the oldest Rust the manifests say builds tgradish, their `rust-version`
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust of rust-version
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          # over rust-toolchain.toml's stable
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  # the built-in ffmpeg backend, against the distribution's ffmpeg libraries
  linked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ffmpeg and its development files
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev
      # only core's code changes with the feature; the command line and the
      # window are tested as they run with it, the other crates don't use it
      - run: cargo clippy -p tgradish-core --all-targets --features linked --locked -- -D warnings
      - run: >
          cargo test -p tgradish-core -p tgradish -p tgradish-gui
          --features tgradish/linked

  # what only musl builds have, their allocator, and the crates' C parts
  # built with musl-gcc
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: >
          cargo clippy -p tgradish --target x86_64-unknown-linux-musl --all-targets --locked
          -- -D warnings
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

  # tgs-lab, a workspace of its own: .tgs output rendered with tlottie and
  # rlottie
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/tgs-lab -> target
      - name: Install what Telegram's rlottie builds with
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - run: cargo fmt --manifest-path crates/tgs-lab/Cargo.toml --check
      - run: >
          cargo clippy --manifest-path crates/tgs-lab/Cargo.toml --all-targets
          --features rlottie --locked -- -D warnings
      - run: cargo test --manifest-path crates/tgs-lab/Cargo.toml --features rlottie

  # the libraries a web page can run, with no files, processes or threads
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check -p tgradish-frames -p tgradish-tgs --target wasm32-unknown-unknown --locked
