name: nix

# Builds the flake's package, which runs the tests in Nix's sandbox, and
# its development shell.
on:
  push:
    branches: [main]
    paths:
      # what the package is built from, the fileset in packaging/nix/package.nix
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - xtask/**
      - licenses/**
      - LICENSE.txt
      - .github/workflows/nix.yml
      - "!crates/tgs-lab/**"
      - "!**.md"
  pull_request:
    paths:
      # as above
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - xtask/**
      - licenses/**
      - LICENSE.txt
      - .github/workflows/nix.yml
      - "!crates/tgs-lab/**"
      - "!**.md"
  workflow_dispatch:

# a newer push makes an older run of the same branch or pull request moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # fails when flake.lock is missing an input
      - run: nix flake check -L --no-update-lock-file
      - name: Run the package
        run: |
          nix build .#tgradish
          ./result/bin/tgradish --version
          # ffmpeg comes with the package
          ./result/bin/tgradish ffmpeg status
      - run: nix develop --command cargo --version
