name: nix

# Builds the Nix flake package (running tests in the sandbox) and checks the
# dev shell.
on:
  push:
    branches: [main]
    paths:
      # Matches the source fileset in packaging/nix/package.nix.
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - xtask/**
      - .github/workflows/nix.yml
      - "!crates/tgs-lab/**"
      - "!**.md"
  pull_request:
    paths:
      # Matches the source fileset in packaging/nix/package.nix.
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - xtask/**
      - .github/workflows/nix.yml
      - "!crates/tgs-lab/**"
      - "!**.md"
  workflow_dispatch:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  flake:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Fails if flake.lock is missing any input.
      - run: nix flake check -L --no-update-lock-file
      - name: Run the package
        run: |
          nix build .#tgradish
          ./result/bin/tgradish --version
          # Verify wrapped ffmpeg works.
          ./result/bin/tgradish ffmpeg status
      - run: nix develop --command cargo --version
