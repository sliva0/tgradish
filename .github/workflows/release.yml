name: release

# Builds single-file tgradish binaries with ffmpeg linked statically, for
# Linux (x86-64 and aarch64) and Windows (cross-compiled with mingw-w64),
# and Linux binaries that use the system's ffmpeg instead. Tests them, and
# on a version tag drafts a GitHub release with them and the ffmpeg sources
# the LGPL asks for. Pull requests that touch the ffmpeg build run it too.
on:
  push:
    tags: ["v*"]
    # TODO: remove before merging into master; manual runs only work for
    # workflows on the default branch, so this tests releases until then
    branches: [rewrite-v2]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths:
      - xtask/**
      - crates/core/src/linked/**
      - Cargo.lock
      - .github/workflows/release.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux containers (AlmaLinux 8, glibc
          # 2.28) so they start on older distributions too
          - target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          # MinGW headers older than 11 lack the Direct3D 12 headers that
          # ffmpeg-sys-next's bindings include
          - target: windows-x86_64
            triple: x86_64-pc-windows-gnu
            runner: ubuntu-24.04
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools (Linux)
        if: matrix.container
        run: |
          dnf install -y clang perl zip xz pkgconf-pkg-config
          if [ "$(uname -m)" = x86_64 ]; then dnf install -y nasm; fi
          pipx install meson
          pipx install ninja
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build tools (Windows)
        if: ${{ !matrix.container }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build pkg-config clang libclang-dev zip mingw-w64

      - run: rustup target add ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/main.rs') }}

      - run: cargo xtask ffmpeg --target ${{ matrix.target }}

      - name: Build tgradish with ffmpeg linked in
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/ffmpeg/prefix-${{ matrix.triple }}/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: "1"
          PKG_CONFIG_ALLOW_CROSS: "1"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          # the stubs come last, so they only fill in headers MinGW lacks
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu: >-
            -I/usr/x86_64-w64-mingw32/include
            -I${{ github.workspace }}/xtask/mingw-stubs
          # links winpthread and libgcc into the executable instead of
          # depending on their DLLs; `xtask package` checks the result
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C link-arg=-static
        run: >
          cargo build --release --locked -p tgradish
          --features linked-static --target ${{ matrix.triple }}

      - name: Package
        if: ${{ !matrix.container }}
        run: cargo xtask package --target ${{ matrix.target }}

      # the system-ffmpeg build replaces the linked one, packaged first
      - name: Package, then build and package without ffmpeg
        if: matrix.container
        run: |
          cargo xtask package --target ${{ matrix.target }} --max-glibc 2.28
          cargo build --release --locked -p tgradish --target ${{ matrix.triple }}
          cargo xtask package --target ${{ matrix.target }} --system-ffmpeg --max-glibc 2.28

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/*.sha256

  # runs the Linux builds on a current Ubuntu, with and without ffmpeg
  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      - name: Convert with each build
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd artifacts
          for archive in tgradish-*.tar.gz; do tar -xzf "$archive"; done
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:d=4 -pix_fmt yuv420p input.mp4
          for bin in tgradish-*/tgradish; do
            echo "== $bin"
            ldd "$bin"
            "$bin" ffmpeg status
            "$bin" convert input.mp4 -o out.webm --preset fast --overwrite
            "$bin" inspect out.webm
          done
          # the system-ffmpeg build really uses the system's
          tgradish-*-system-ffmpeg/tgradish --json ffmpeg status | grep -q /usr/bin/ffmpeg

  # runs the Windows build on Windows
  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x86_64
          path: artifacts

      # made here instead of with a downloaded ffmpeg, so the test needs
      # nothing but the release
      - name: Draw a test image with alpha
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = New-Object System.Drawing.Bitmap 320, 240
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.FillEllipse([System.Drawing.Brushes]::Orange, 40, 20, 240, 200)
          $graphics.FillRectangle([System.Drawing.Brushes]::Teal, 120, 90, 80, 60)
          $image.Save("$PWD\artifacts\input.png", [System.Drawing.Imaging.ImageFormat]::Png)

      - name: Convert with the built-in ffmpeg
        shell: bash
        run: |
          cd artifacts
          unzip -q tgradish-*.zip
          bin=$(ls tgradish-*/tgradish.exe)
          # opens the window without a console when started from Explorer
          grep -q consoleAllocationPolicy "$bin"
          "$bin" ffmpeg status
          "$bin" convert input.png -o still.webm --length 1 --preset fast
          # VP9 with alpha in, which needs the libvpx decoder
          "$bin" convert still.webm -o out.webm --preset fast
          "$bin" inspect out.webm
          # Windows paths and an output that already exists
          "$bin" convert still.webm -o out.webm --preset fast && exit 1 || true

  publish:
    needs: [build, test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/main.rs') }}
      - run: cargo xtask ffmpeg-sources

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "tgradish $GITHUB_REF_NAME" --generate-notes
          artifacts/* target/ffmpeg/ffmpeg-*-sources.tar
