name: release

# Builds single-file tgradish binaries with ffmpeg linked statically, for
# Linux (x86-64 and aarch64, for glibc and for musl) and Windows
# (cross-compiled with mingw-w64), the glibc ones also as .deb and .rpm
# packages, and glibc binaries that use the system's ffmpeg instead. Tests
# them, and on a version tag drafts a GitHub release with them and the
# ffmpeg sources the LGPL asks for. Pull requests that touch the ffmpeg
# build run it too.
on:
  push:
    tags: ["v*"]
  # changes to what the release jobs build with, which CI alone doesn't
  # catch: the ffmpeg build and the filters it must have, the binary's
  # resources and the notices it carries
  pull_request:
    paths:
      - xtask/**
      - crates/core/src/linked/**
      - crates/core/src/ffmpeg/args.rs
      - crates/core/build.rs
      - crates/core/licenses/**
      - crates/cli/build.rs
      - crates/cli/tgradish.rc
      - crates/cli/tgradish.exe.manifest
      - crates/cli/assets/**
      # features, dependencies and profiles
      - Cargo.toml
      - crates/core/Cargo.toml
      - crates/cli/Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release.yml
  workflow_dispatch:

# a newer push makes an older run of the same pull request moot; a tag's run
# is never cut short
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# only the job that drafts the release writes to the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux containers (AlmaLinux 8, glibc
          # 2.28) so they start on older distributions too. The images are
          # pinned by digest, here those tagged 2026.11.07-1, so a release
          # is built in the image its pull request was, and the cache of
          # ffmpeg builds below is keyed by it. To renew them, take the
          # digests of a newer tag from quay.io/pypa/manylinux_2_28_x86_64
          # and _aarch64
          - target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
          - target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
          # for Alpine and other musl distributions, with Ubuntu's musl-gcc
          - target: linux-musl-x86_64
            triple: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            container: ""
          - target: linux-musl-aarch64
            triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            container: ""
          # MinGW-w64 before 12 (Ubuntu 24.04 has 11) lacks d3d12video.h,
          # which ffmpeg-sys-next's bindings include: xtask/mingw-stubs has
          # an empty one
          - target: windows-x86_64
            triple: x86_64-pc-windows-gnu
            runner: ubuntu-24.04
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # archives are named after the version in Cargo.toml, the release
      # after the tag, and the AUR packages download it by their pkgver; the
      # Windows executable takes Cargo.toml's when it is built
      - name: Check the tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          for pkgbuild in packaging/aur/*/PKGBUILD; do
            if ! grep -qx "pkgver=$version" "$pkgbuild"; then
              echo "$pkgbuild doesn't say pkgver=$version"
              exit 1
            fi
          done

      - name: Install build tools (Linux)
        if: matrix.container
        run: |
          dnf install -y clang perl zip xz pkgconf-pkg-config
          if [ "$(uname -m)" = x86_64 ]; then dnf install -y nasm; fi
          # dav1d's build tools, pinned like everything else a release is
          # built with
          pipx install meson==1.12.1
          pipx install ninja==1.13.2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build tools (Windows and musl)
        if: ${{ !matrix.container }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build pkg-config clang libclang-dev zip
          case "${{ matrix.target }}" in
            windows-*) sudo apt-get install -y mingw-w64 ;;
            linux-musl-*) sudo apt-get install -y musl-tools ;;
          esac

      - run: rustup target add ${{ matrix.triple }}
      # ffmpeg-sys-next packs the static libraries into its rlib, and
      # `xtask ffmpeg` only makes cargo build it again in a run that builds
      # them: a build cache from before a new ffmpeg recipe, beside a cache
      # of the new libraries, would link the old ones
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.triple }}-${{ hashFiles('xtask/src/ffmpeg.rs') }}

      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/ffmpeg.rs') }}
      # the libraries built, which `xtask ffmpeg` keeps when they were made
      # from its recipe; the key changes with it, and with the manylinux
      # image they were built in, by its digest, or the runner's release of
      # Ubuntu. A tag's run only finds those main's runs saved, as one
      # started by hand there
      - uses: actions/cache@v6
        with:
          path: |
            target/ffmpeg/prefix-${{ matrix.triple }}
            target/ffmpeg/licenses-${{ matrix.triple }}
          key: ffmpeg-${{ matrix.triple }}-${{ matrix.container || matrix.runner }}-${{ hashFiles('xtask/src/ffmpeg.rs') }}

      - run: cargo xtask ffmpeg --target ${{ matrix.target }}

      # with the settings of xtask/src/build.rs, which local-release shares
      - name: Build tgradish with ffmpeg linked in
        run: cargo xtask build --target ${{ matrix.target }}

      - name: Package
        if: ${{ !matrix.container }}
        run: cargo xtask package --target ${{ matrix.target }}

      # the system-ffmpeg build replaces the linked one, packaged first, also
      # as a .deb and an .rpm
      - name: Package, then build and package without ffmpeg
        if: matrix.container
        run: |
          cargo xtask package --target ${{ matrix.target }} --max-glibc 2.28
          cargo xtask build --target ${{ matrix.target }} --system-ffmpeg
          cargo xtask package --target ${{ matrix.target }} --system-ffmpeg --max-glibc 2.28

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/*.deb
            target/release-artifacts/*.rpm
            target/release-artifacts/*.sha256

  # runs the Linux builds on a current Ubuntu, with and without ffmpeg
  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      - name: Convert with each build
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd artifacts
          for archive in tgradish-*.tar.gz; do tar -xzf "$archive"; done
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:d=4 -pix_fmt yuv420p input.mp4
          # a 16 x 16 PNG: a red square in a transparent border
          echo iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAG0lEQVR42mNgGF7gjobGf2LwqAGjBtDWgKEJAGe22M1pQ+POAAAAAElFTkSuQmCC | base64 -d > input.png
          for bin in tgradish-*/tgradish; do
            echo "== $bin"
            ldd "$bin"
            "$bin" ffmpeg status
            "$bin" convert input.mp4 -o out.webm --preset fast --overwrite
            "$bin" convert input.png -o out.tgs --overwrite
            "$bin" convert input.png -o out.webp --overwrite
            "$bin" inspect out.webm out.tgs out.webp
          done
          # the system-ffmpeg build really uses the system's
          tgradish-*-system-ffmpeg/tgradish --json ffmpeg status | grep -q /usr/bin/ffmpeg

  # runs the musl builds on Alpine: converting, and opening the window on
  # virtual X11 and Wayland displays, drawn by Mesa's software renderer
  test-musl:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-24.04
          - target: linux-musl-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      # in a container started here, as the runner's actions don't run in
      # Alpine's
      - name: Convert and open the window on Alpine
        run: |
          cat > artifacts/test.sh <<'EOF'
          set -ex
          apk add -q xvfb weston weston-backend-headless weston-shell-desktop \
            mesa-dri-gallium mesa-gl mesa-egl libxkbcommon libxkbcommon-x11 libx11 \
            libxcursor libxi libxrender wayland-libs-client wayland-libs-egl dbus-libs
          tar -xzf tgradish-*.tar.gz
          bin=$(echo "$PWD"/tgradish-*/tgradish)
          "$bin" --version
          "$bin" ffmpeg status
          # a 16 x 16 PNG: a red square in a transparent border
          echo iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAG0lEQVR42mNgGF7gjobGf2LwqAGjBtDWgKEJAGe22M1pQ+POAAAAAElFTkSuQmCC | base64 -d > input.png
          "$bin" convert input.png -o still.webm --length 1 --preset fast
          # VP9 with alpha in, which needs the libvpx decoder
          "$bin" convert still.webm -o out.webm --preset fast
          "$bin" convert input.png -o out.tgs
          "$bin" convert input.png -o out.webp
          "$bin" inspect out.webm out.tgs out.webp
          export XDG_RUNTIME_DIR=/tmp
          # still open after a while: it found the system's libraries and drew
          window() {
            env "$1" "$bin" gui & pid=$!
            sleep 10
            kill -0 $pid
            kill $pid
          }
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          window DISPLAY=:99
          weston --backend=headless --renderer=gl --socket=wl-test &
          sleep 2
          window WAYLAND_DISPLAY=wl-test
          EOF
          docker run --rm -v "$PWD/artifacts:/test" -w /test alpine:latest sh test.sh

  # installs the .deb and .rpm on the distributions they are for, which
  # resolves their dependencies, and converts with what they installed
  test-packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported and the newest of each family, roughly;
          # AlmaLinux 8 has glibc 2.28, the oldest the packages are for
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "almalinux:8" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:22.04" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "fedora:latest" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "opensuse/tumbleweed" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "debian:12" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "fedora:latest" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      - name: Install
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./artifacts/*.deb
          elif command -v dnf >/dev/null; then
            dnf install -y ./artifacts/*.rpm
          else
            zypper --non-interactive install --allow-unsigned-rpm ./artifacts/*.rpm
          fi

      - name: Convert with the installed tgradish
        run: |
          tgradish --version
          tgradish ffmpeg status
          test -f /usr/share/applications/tgradish.desktop
          # a 16 x 16 PNG: a red square in a transparent border
          echo iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAG0lEQVR42mNgGF7gjobGf2LwqAGjBtDWgKEJAGe22M1pQ+POAAAAAElFTkSuQmCC | base64 -d > input.png
          tgradish convert input.png -o out.webm --length 1 --preset fast
          tgradish convert input.png -o out.tgs
          tgradish convert input.png -o out.webp
          tgradish inspect out.webm out.tgs out.webp

  # runs the Windows build on Windows
  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x86_64
          path: artifacts

      # made here instead of with a downloaded ffmpeg, so the test needs
      # nothing but the release
      - name: Draw a test image with alpha
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = New-Object System.Drawing.Bitmap 320, 240
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.FillEllipse([System.Drawing.Brushes]::Orange, 40, 20, 240, 200)
          $graphics.FillRectangle([System.Drawing.Brushes]::Teal, 120, 90, 80, 60)
          $image.Save("$PWD\artifacts\input.png", [System.Drawing.Imaging.ImageFormat]::Png)

      - name: Convert with the built-in ffmpeg
        shell: bash
        run: |
          cd artifacts
          unzip -q tgradish-*.zip
          bin=$(ls tgradish-*/tgradish.exe)
          # opens the window without a console when started from Explorer
          grep -q consoleAllocationPolicy "$bin"
          "$bin" ffmpeg status
          "$bin" convert input.png -o still.webm --length 1 --preset fast
          # VP9 with alpha in, which needs the libvpx decoder
          "$bin" convert still.webm -o out.webm --preset fast
          "$bin" convert input.png -o out.tgs --preset fast
          "$bin" convert input.png -o out.webp
          "$bin" inspect out.webm out.tgs out.webp
          # Windows paths and an output that already exists
          "$bin" convert still.webm -o out.webm --preset fast && exit 1 || true

  # drafts the release, on a tag. Every other run does all of it but that
  # last step, so a tag isn't the first time the steps before it run
  publish:
    needs: [build, test-linux, test-musl, test-packages, test-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/ffmpeg.rs') }}
      - run: cargo xtask ffmpeg-sources

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # fails without the archive of ffmpeg's sources
      - name: List what the release holds
        run: ls -l artifacts target/ffmpeg/ffmpeg-*-sources.tar

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "tgradish $GITHUB_REF_NAME" --generate-notes
          artifacts/* target/ffmpeg/ffmpeg-*-sources.tar
