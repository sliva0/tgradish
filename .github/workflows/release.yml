name: release

# Builds single-file tgradish binaries, archives, and packages for Linux
# (x86-64 and aarch64, glibc and musl) and Windows (x86-64 via mingw-w64), all
# named without the version:
# - Static ffmpeg builds for all targets (plus .deb/.rpm for glibc and a
#   standalone .exe for Windows).
# - System-ffmpeg tarballs for Linux glibc.
# Verifies version consistency, tests all packages, and on version tags drafts a
# GitHub release with the LGPL ffmpeg sources and changelog notes. Also runs on
# PRs that touch the ffmpeg or release build.
on:
  push:
    tags: ["v*"]
  # Trigger on PRs touching files that regular CI does not fully exercise
  # (ffmpeg build, linked backend, resources, licences, packaging).
  pull_request:
    paths:
      - xtask/**
      - crates/core/src/linked/**
      - crates/core/src/ffmpeg/args.rs
      - crates/core/build.rs
      - crates/core/licenses/**
      - crates/cli/build.rs
      - crates/cli/tgradish.rc
      - crates/cli/tgradish.exe.manifest
      - crates/cli/assets/**
      # AUR packages tested by test-aur.
      - packaging/aur/**
      # Features, dependencies, and release profiles.
      - Cargo.toml
      - crates/core/Cargo.toml
      - crates/cli/Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release.yml
      - .github/smoke.sh
  workflow_dispatch:

# Cancel superseded PR runs, but never cancel a tag run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the final `publish` job requests write permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify versions match everywhere, with a dated changelog section, and match
  # the tag on tag runs: the release is named after the tag and AUR packages
  # download by pkgver, while archive folders, packages, and binaries take
  # Cargo.toml's version at build time. Fail here before long builds.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask release check --tag "$GITHUB_REF_NAME"
          else
            cargo xtask release check
          fi

  # Dry-run crates.io packaging and builds for all four publishable crates, in
  # the order `cargo xtask release crates` publishes them: runs on tags (before
  # publishing by hand) and manual runs. Regular CI only checks the two library
  # crates because the GUI and CLI take several minutes longer.
  crates:
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: >
          cargo publish --dry-run --locked
          -p tgradish-tgs -p tgradish-core -p tgradish-gui -p tgradish

  build:
    needs: version
    # Pin Rust for reproducible release builds (overrides rust-toolchain.toml).
    # Updated by `cargo xtask release prepare`; see CONTRIBUTING.md.
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux glibc binaries in manylinux_2_28 (AlmaLinux 8, glibc
          # 2.28) for broad distro compatibility. Images are pinned by digest
          # (tag 2026.11.07-1) so builds match PR tests and ffmpeg cache keys
          # stay valid. To update, take a newer tag's digests from
          # quay.io/pypa/manylinux_2_28_{x86_64,aarch64}.
          - target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
          - target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
          # Build musl binaries for Alpine and other musl distros using
          # Ubuntu's musl-gcc.
          - target: linux-musl-x86_64
            triple: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            container: ""
          - target: linux-musl-aarch64
            triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            container: ""
          # MinGW-w64 < 12 (Ubuntu 24.04 ships 11) lacks d3d12video.h, which
          # ffmpeg-sys-next includes; xtask/mingw-stubs supplies an empty stub.
          - target: windows-x86_64
            triple: x86_64-pc-windows-gnu
            runner: ubuntu-24.04
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: matrix.container
        run: |
          dnf install -y clang perl zip xz pkgconf-pkg-config
          if [ "$(uname -m)" = x86_64 ]; then dnf install -y nasm; fi
          # Pin dav1d build tools for reproducible releases.
          pipx install meson==1.12.1
          pipx install ninja==1.13.2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build tools (Windows and musl)
        if: ${{ !matrix.container }}
        run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build pkg-config clang libclang-dev zip
          case "${{ matrix.target }}" in
            windows-*) sudo apt-get install -y mingw-w64 ;;
            linux-musl-*) sudo apt-get install -y musl-tools ;;
          esac

      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.triple }}
      # Include ffmpeg.rs in the cache key: ffmpeg-sys-next embeds static libs
      # in its rlib, so a stale Rust cache could otherwise link old ffmpeg
      # libraries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.triple }}-${{ hashFiles('xtask/src/ffmpeg.rs') }}

      # Cache downloaded source tarballs only; builds happen in
      # target/ffmpeg/build-<triple>, which is not cached.
      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/ffmpeg.rs') }}
      # Cache built ffmpeg libraries and licences, keyed by target, container
      # digest or Ubuntu runner, and ffmpeg.rs. A tag run only finds caches
      # saved on main (for example from a run started by hand there).
      - uses: actions/cache@v6
        with:
          path: |
            target/ffmpeg/prefix-${{ matrix.triple }}
            target/ffmpeg/licenses-${{ matrix.triple }}
          key: ffmpeg-${{ matrix.triple }}-${{ matrix.container || matrix.runner }}-${{ hashFiles('xtask/src/ffmpeg.rs') }}

      # The command that builds releases locally too, so both make the same
      # files: ffmpeg unless cached, then each build packed (for glibc also
      # one without ffmpeg, both checked against manylinux_2_28's glibc) and,
      # where it runs on this machine, smoke-tested.
      - name: Build and package every variant
        run: >
          cargo xtask local-release --targets ${{ matrix.target }}
          ${{ matrix.container && '--max-glibc 2.28' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/*.deb
            target/release-artifacts/*.rpm
            target/release-artifacts/*.exe
            target/release-artifacts/*.sha256

  # Smoke-test both Linux glibc variants (built-in and system ffmpeg) on Ubuntu.
  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # Only the smoke test, which every test job runs. Containers without
      # git download the whole repository instead.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      - name: Convert with each build
        run: |
          # Retry stalled apt downloads instead of hanging.
          sudo sh -c "echo 'Acquire::Retries \"3\"; Acquire::http::Timeout \"30\"; Acquire::https::Timeout \"30\";' > /etc/apt/apt.conf.d/80-stalls"
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd artifacts
          for archive in tgradish-*.tar.gz; do tar -xzf "$archive"; done
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:d=4 -pix_fmt yuv420p input.mp4
          for bin in tgradish-*/tgradish; do
            ldd "$bin"
            sh ../.github/smoke.sh "$bin"
            # A longer H.264 video, which only this job converts.
            "$bin" convert input.mp4 -o out.webm --preset fast --overwrite
          done
          # Confirm the system-ffmpeg variant actually uses /usr/bin/ffmpeg.
          tgradish-*-system-ffmpeg/tgradish --json ffmpeg status | grep -q /usr/bin/ffmpeg

  # Smoke-test musl builds on Alpine: conversions plus launching the GUI under
  # headless X11 (Xvfb) and Wayland (weston) with Mesa software rendering.
  test-musl:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-24.04
          - target: linux-musl-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # Only the smoke test (see test-linux).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      # Run Alpine inside Docker because GitHub Actions steps cannot run
      # directly on musl; the smoke test goes in through the mount.
      - name: Convert and open the GUI on Alpine
        run: |
          cp .github/smoke.sh artifacts/
          cat > artifacts/test.sh <<'EOF'
          set -ex
          apk add -q xvfb weston weston-backend-headless weston-shell-desktop \
            mesa-dri-gallium mesa-gl mesa-egl libxkbcommon libxkbcommon-x11 libx11 \
            libxcursor libxi libxrender wayland-libs-client wayland-libs-egl dbus-libs
          tar -xzf tgradish-*.tar.gz
          bin=$(echo "$PWD"/tgradish-*/tgradish)
          sh smoke.sh "$bin"
          # Verify man pages and completions are present: packaging omits them
          # from a musl archive when it cannot run the binary, but release
          # archives must include them.
          test -f "${bin%/tgradish}/man/tgradish.1.gz"
          test -f "${bin%/tgradish}/completions/tgradish.nu"
          export XDG_RUNTIME_DIR=/tmp
          # Confirm the GUI stays alive for 10s (libraries loaded and window
          # rendered).
          gui() {
            env "$1" "$bin" gui & pid=$!
            sleep 10
            kill -0 $pid
            kill $pid
          }
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          gui DISPLAY=:99
          weston --backend=headless --renderer=gl --socket=wl-test &
          sleep 2
          gui WAYLAND_DISPLAY=wl-test
          EOF
          docker run --rm -v "$PWD/artifacts:/test" -w /test alpine:latest sh test.sh

  # Install the .deb and .rpm packages on their target distros (which resolves
  # their dependencies) and run conversions with the installed binary.
  test-packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cover roughly the oldest and newest supported releases per family
          # (AlmaLinux 8 provides our minimum supported glibc 2.28).
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "almalinux:8" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:22.04" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "fedora:latest" }
          - { target: linux-x86_64, runner: ubuntu-24.04, image: "opensuse/tumbleweed" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "debian:12" }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, image: "fedora:latest" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      # Only the smoke test (see test-linux).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: artifacts

      - name: Install
        run: |
          if command -v apt-get >/dev/null; then
            # Retry stalled apt downloads instead of hanging.
            echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' > /etc/apt/apt.conf.d/80-stalls
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./artifacts/*.deb
          elif command -v dnf >/dev/null; then
            dnf install -y ./artifacts/*.rpm
          else
            zypper --non-interactive install --allow-unsigned-rpm ./artifacts/*.rpm
          fi

      - name: Convert with the installed tgradish
        run: |
          test -f /usr/share/applications/tgradish.desktop
          sh .github/smoke.sh tgradish

  # Build each AUR package with makepkg from the just-built archives (and a git
  # archive of this commit for the source package), install it, and test
  # conversions. Runs on x86-64 only (the only Arch Linux container image).
  test-aur:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      # Install git before checkout so git archive can package HEAD.
      - run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x86_64
          path: artifacts

      - name: Build, install and run each package
        shell: bash
        run: |
          set -euxo pipefail
          version=$(sed -n 's/^pkgver=//p' packaging/aur/tgradish/PKGBUILD)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="tgradish-$version/" -o /tmp/source.tar.gz HEAD
          # makepkg refuses to run as root.
          useradd -m builder
          for package in tgradish-bin tgradish-static-bin tgradish; do
            dir=/tmp/aur/$package
            mkdir -p "$dir"
            cp "packaging/aur/$package/PKGBUILD" "$dir"
            # Stage local archives under the filenames makepkg expects so it
            # skips downloading.
            case $package in
              tgradish) cp /tmp/source.tar.gz "$dir/tgradish-$version.tar.gz" ;;
              tgradish-bin)
                cp artifacts/tgradish-linux-x86_64-system-ffmpeg.tar.gz "$dir/$package-$version-x86_64.tar.gz" ;;
              tgradish-static-bin)
                cp artifacts/tgradish-linux-x86_64.tar.gz "$dir/$package-$version-x86_64.tar.gz" ;;
            esac
            chown -R builder "$dir"
            # Install dependencies as root before running makepkg as builder.
            (cd "$dir" && runuser -u builder -- makepkg --printsrcinfo > .SRCINFO)
            pacman -S --noconfirm --needed $(sed -n 's/^\t\(make\)\?depends = //p' "$dir/.SRCINFO")
            (cd "$dir" && runuser -u builder -- makepkg --noconfirm)
            pacman -U --noconfirm "$dir"/*.pkg.tar.zst
            (cd /tmp && sh "$GITHUB_WORKSPACE/.github/smoke.sh" tgradish)
            pacman -R --noconfirm "$package"
          done

      # The PKGBUILD's check() runs only tgradish-tgs; run the full suite here
      # as non-root `builder` (permission tests fail under root) with
      # --no-fail-fast.
      - name: Run every crate's tests
        shell: bash
        run: |
          set -euxo pipefail
          pacman -S --noconfirm --needed ffmpeg
          version=$(sed -n 's/^pkgver=//p' packaging/aur/tgradish/PKGBUILD)
          cd "/tmp/aur/tgradish/src/tgradish-$version"
          runuser -u builder -- env TGRADISH_REQUIRE_FFMPEG=1 cargo test --locked --no-fail-fast \
            -p tgradish-tgs -p tgradish-core -p tgradish

  # Smoke-test the Windows build on Windows.
  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Only the smoke test (see test-linux).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x86_64
          path: artifacts

      # Git Bash, which Windows runners have, runs the smoke test's POSIX sh.
      - name: Convert with the built-in ffmpeg
        shell: bash
        run: |
          cd artifacts
          unzip -q tgradish-*.zip
          bin=$(ls tgradish-*/tgradish.exe)
          # Verify the embedded manifest suppresses the console window when
          # launched from Explorer.
          grep -q consoleAllocationPolicy "$bin"
          sh ../.github/smoke.sh "$bin"
          # Verify Windows paths and refusal to overwrite an existing file.
          "$bin" convert still.webm -o out.webm --preset fast && exit 1 || true
          # Verify standalone tgradish.exe matches the zip copy and embeds LGPL
          # notices.
          cmp tgradish.exe "$bin"
          # Redirect to a file first so `grep -q` does not trigger a broken
          # pipe.
          ./tgradish.exe licenses > licenses.txt
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" licenses.txt
          grep -q -- "-sources.tar, published with each tgradish release" licenses.txt

  # Gather all release builds and the LGPL ffmpeg sources. Runs on PRs too
  # (read-only) so packaging is exercised before tagging. A tag whose crates
  # fail to package drafts no release; on PRs `crates` is skipped, so use
  # `!cancelled() && !failure()` to avoid skipping this job too.
  assemble:
    needs: [crates, build, test-linux, test-musl, test-packages, test-aur, test-windows]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: target/ffmpeg/sources
          key: ffmpeg-sources-${{ hashFiles('xtask/src/ffmpeg.rs') }}
      - run: cargo xtask ffmpeg-sources

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # Fail if the ffmpeg source archive is missing.
      - name: Put ffmpeg's sources beside the builds
        run: |
          cp target/ffmpeg/ffmpeg-*-sources.tar artifacts/
          ls -l artifacts

      # Write a combined SHA256SUMS file alongside per-file .sha256 files.
      # Write to $RUNNER_TEMP first so SHA256SUMS does not hash itself.
      - name: Sum every file in one list
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort | xargs -d '\n' sha256sum -- > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # Disable re-compression since artifacts are already compressed.
      - uses: actions/upload-artifact@v7
        with:
          name: draft
          path: artifacts/*
          compression-level: 0
          if-no-files-found: error

      # Extract release notes from CHANGELOG.md for Cargo.toml's version (which
      # matches the tag); fails if there is no section for that version.
      - name: Take the notes from the changelog
        run: |
          mkdir notes
          cargo xtask release notes > notes/notes.md
          cat notes/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes/notes.md
          if-no-files-found: error

  # Create a draft GitHub release on tag pushes. Isolated as the only job with
  # contents:write and executes no repository code.
  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: draft
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes

      # Combine the changelog section with GitHub's generated change list into
      # a draft release for a person to publish. The run summary links the
      # draft and lists the remaining release steps.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url=$(gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "tgradish $GITHUB_REF_NAME" --notes-file notes/notes.md \
            --generate-notes artifacts/*)
          {
            echo "Drafted [tgradish $GITHUB_REF_NAME]($url). Check it and publish it, then:"
            echo
            echo '    cargo xtask release aur --push'
            echo '    cargo xtask release crates'
          } >> "$GITHUB_STEP_SUMMARY"
