# Licences accepted for crates bundled in release binaries
# (`cargo xtask licenses` via `cargo about`). For dual-licensed crates,
# the first matching entry is chosen.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # Used by ffmpeg-next when ffmpeg is linked in.
    "WTFPL",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
